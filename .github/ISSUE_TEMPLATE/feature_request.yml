name: Feature request
description: Something the widget could show or do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to see or do
      description: The situation, not the solution. What are you looking for and where do you look for it now?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How the widget could help
  - type: checkboxes
    id: providers
    attributes:
      label: Which agents this is about
      options:
        - label: Claude Code
        - label: Codex
        - label: Hermes Agent
